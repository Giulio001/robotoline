<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b101c">
  <meta name="description" content="Un piccolo clone di Factorio nel browser: estrai, trasporta e automatizza.">
  <title>Factory · Automazione</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23151d2d'/%3E%3Crect x='22' y='40' width='56' height='34' rx='4' fill='%23ffb35c'/%3E%3Crect x='30' y='26' width='16' height='16' fill='%2355d6be'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script src="/game.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="mini-brand" href="/">
      <span class="mini-mark">⚙</span>
      <strong>FACTORY <em>AUTOMAZIONE</em></strong>
    </a>
  </header>

  <main class="layout">
    <section class="stage">
      <canvas id="board" width="832" height="576"></canvas>
      <div id="recipe-modal" class="modal hidden">
        <div class="modal-card">
          <h2>Scegli la ricetta</h2>
          <div id="recipe-list" class="recipe-list"></div>
          <button id="recipe-close" class="text-button">Chiudi</button>
        </div>
      </div>
      <div id="toasts" class="toasts" aria-live="polite"></div>
    </section>

    <aside class="sidebar">
      <div class="panel">
        <h2>Hotbar <small>(tasti 1-5, R ruota)</small></h2>
        <div id="hotbar" class="hotbar">
          <button data-tool="drill" class="hotbar-btn active"><b>1</b><span>⛏</span>Trapano</button>
          <button data-tool="belt" class="hotbar-btn"><b>2</b><span>➜</span>Nastro</button>
          <button data-tool="assembler" class="hotbar-btn"><b>3</b><span>⚙</span>Assemblatore</button>
          <button data-tool="chest" class="hotbar-btn"><b>4</b><span>▤</span>Cassa</button>
          <button data-tool="remove" class="hotbar-btn"><b>5</b><span>✕</span>Rimuovi</button>
        </div>
      </div>

      <div class="panel">
        <h2>Inventario</h2>
        <ul id="inventory" class="inventory"></ul>
      </div>

      <div class="panel">
        <h2>Crafting manuale</h2>
        <div id="hand-craft" class="hand-craft"></div>
      </div>

      <div class="panel">
        <h2>Obiettivi</h2>
        <ul id="objectives" class="objectives"></ul>
      </div>

      <div class="panel controls-help">
        <h2>Comandi</h2>
        <p><b>WASD / frecce</b> muovi · <b>E</b> interagisci · <b>R</b> ruota piazzamento</p>
        <p><b>Click sinistro</b> piazza · <b>Click destro</b> rimuovi</p>
      </div>
    </aside>
  </main>
</body>
</html>
